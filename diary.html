<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>my diary</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .diary-wrapper {
      max-width: 700px;
      margin: 30px auto;
      position: relative;
    }

    .notebook-cover {
      background-image: url("images/notebook-cover.jpg");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;

      padding: 40px 35px;
      aspect-ratio: 1 / 1.2;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      position: relative;
      color: #333;
      padding-top: 120px;
    }

    .diary-title {
      font-family: "Dancing Script", cursive;
      font-size: 3em;
      color: hsl(0, 4%, 5%);
      text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.5);
      margin: 0;
      margin-top: 60px;
      margin-right: -20px;
      text-align: center;
      font-weight: 700;
    }

    .open-button {
      position: absolute;
      bottom: 0px;
      right: 50px;
      background-color: hsla(323, 57%, 64%, 0);
      color: white;
      border: 2px solid hsla(311, 54%, 46%, 0);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      font-family: "Noto Sans", sans-serif;
      transition: background-color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em;
      padding: 0;
    }

    .open-button:hover {
      background-color: #b3369c;
    }

    .notebook-pages {
      display: none;
      background-image: url("images/paper.jpg");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      padding: 40px 35px;
      aspect-ratio: 1 / 1.2;
      color: #333;
    }

    .notebook-pages.open {
      display: block;
      animation: slideIn 0.5s ease-in-out;
    }

    @keyframes slideIn {
      0% {
        opacity: 0;
        transform: translateX(20px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .notebook-cover.closing {
      animation: slideOut 0.5s ease-in-out;
    }

    @keyframes slideOut {
      0% {
        opacity: 1;
        transform: translateX(0);
      }
      100% {
        opacity: 0;
        transform: translateX(-20px);
      }
    }

    .diary-entries {
      margin-bottom: 400px;
      margin-top: 0;
      padding-top: 0;
    }

    .diary-entry {
      background-color: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      padding-left: 80px;
      margin-bottom: 10px;
      text-align: left;
      max-width: 520px;
    }

    .diary-entry p {
      margin-top: -3px;
      margin-bottom: 0;
      max-width: 440px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .diary-entry h3 {
      margin-top: -30px;
      color: hsl(315, 10%, 8%);
      font-family: "Dancing Script", cursive;
      font-weight: 700;
    }

    .diary-date {
      font-size: 0.8em;
      color: #888;
      margin-bottom: 30px;      margin-top: -422px;      padding-left: 80px;
    }

    .page-button {
      position: absolute;
      bottom: 0px;
      background-color: hsla(323, 57%, 64%, 0);
      color: white;
      border: 2px solid hsla(311, 54%, 46%, 0);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      font-family: "Noto Sans", sans-serif;
      transition: background-color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em;
      padding: 0;
    }

    .page-button:hover {
      background-color: #b3369c;
    }

    .next-page-button {
      bottom: 25px;
      right: 35px;
      background-color: lab(0.82% 0 0 / 0.027);
      border: 2px solid lab(0.82% 0 0 / 0);
    }

    .next-page-button:hover {
      background-color: #b3369c;
    }

    .prev-page-button {
      bottom: 25px;
      left: 35px;
      background-color: hsla(323, 57%, 64%, 0);
      border: 2px solid hsla(311, 54%, 46%, 0);
    }

    .prev-page-button:hover {
      background-color: #b3369c;
    }

    .close-button {
      display: inline-block;
      background-color: #d76fb0;
      color: white;
      border: 2px solid #b3369c;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: "Noto Sans", sans-serif;
      margin-top: 20px;
      text-decoration: none;
    }

    .close-button:hover {
      background-color: #b3369c;
    }

    .notebook-pages h2 {
      color: hwb(0 0% 100%);
      border-bottom: none !important;
      padding-bottom: 4px;
      margin-top: -50px;
      margin-bottom: 30px;
      padding-top: 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="diary-wrapper">
    <header style="text-align: center; margin-bottom: 30px;">
      <h1>diary</h1>
      <p class="subtitle">my brain</p>
    </header>

    <nav style="text-align: center; margin: 20px 0; padding: 10px; background-color: #ffe6f7; border: 2px solid #d76fb0; border-radius: 8px;">
      <a href="index.html">home</a> |
      <a href="art.html">stuff i like</a> |
      <a href="photography.html">my photography</a> |
      <a href="diary.html">my diary</a> |
      <a href="guestbook.html">guestbook</a>
    </nav>

    <div class="notebook-cover">
      <h2 class="diary-title">diary</h2>
      <button class="open-button" onclick="openNotebook()">➜</button>
    </div>

    <div class="notebook-pages">
      <h2 style="font-family: 'Dancing Script', cursive; font-weight: 700; color: #b3369c;">my diary entries</h2>
      
      <div class="diary-entries">
        <div class="diary-entry">
          <p class="diary-date"><strong>08/25/26</strong> </p>
          <p>
           I've spent most of today messing w/ this silly website and trying to get it to look how i want!!! it's kinda fun 
          </p>
        </div>
      </div>

      <button class="page-button prev-page-button" onclick="closeNotebook()">←</button>
      <button class="page-button next-page-button" onclick="nextPage()">→</button>
    </div>
  </div>

  <script>
    let currentPage = 1;

    function openNotebook() {
      const cover = document.querySelector('.notebook-cover');
      const pages = document.querySelector('.notebook-pages');
      
      cover.classList.add('closing');
      setTimeout(() => {
        cover.style.display = 'none';
        pages.classList.add('open');
        currentPage = 1;
      }, 500);
    }

    function closeNotebook() {
      const cover = document.querySelector('.notebook-cover');
      const pages = document.querySelector('.notebook-pages');
      
      pages.classList.remove('open');
      setTimeout(() => {
        cover.classList.remove('closing');
        cover.style.display = 'flex';
        currentPage = 1;
      }, 500);
    }

    function nextPage() {
      currentPage++;
      // You can add page navigation logic here
      // For now, it just increments the page counter
    }
  </script>
  <script src="oneko.js"></script>
</body>
</html>
