<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>diary</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .diary-wrapper {
      max-width: 700px;
      margin: 30px auto;
      position: relative;
    }

    .notebook-pages {
      display: block;
      background-image: url("images/paper.jpg");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      padding: 40px 35px;
      aspect-ratio: 1 / 1.2;
      color: #333;
    }

    .diary-entries {
      margin-bottom: 400px;
      margin-top: 0;
      padding-top: 0;
    }

    .diary-entry {
      background-color: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      padding-left: 80px;
      margin-bottom: 10px;
      text-align: left;
      max-width: 520px;
    }

    .diary-entry p {
      margin-top: -3px;
      margin-bottom: 0;
      max-width: 440px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .diary-date {
      font-size: 0.8em;
      color: #888;
      margin-bottom: 30px;
      margin-top: -2px;
      padding-left: 80px;
    }

    .page-button {
      position: absolute;
      bottom: 0px;
      background-color: hsla(323, 57%, 64%, 0);
      color: white;
      border: 2px solid hsla(311, 54%, 46%, 0);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      font-family: "Noto Sans", sans-serif;
      transition: background-color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em;
      padding: 0;
    }

    .page-button:hover {
      background-color: #b3369c;
    }

    .next-page-button {
      bottom: 25px;
      right: 35px;
    }

    .prev-page-button {
      bottom: 25px;
      left: 35px;
    }

    .notebook-pages h2 {
      color: #333;
      border-bottom: none !important;
      padding-bottom: 4px;
      margin-top: -50px;
      margin-bottom: 30px;
      padding-top: 0;
      text-align: center;
      font-family: "Dancing Script", cursive;
      font-weight: 700;
      color: #b3369c;
    }
  </style>
</head>
<body>
  <div class="diary-wrapper">
    <header style="text-align: center; margin-bottom: 30px;">
      <h1>my diary</h1>
      <p class="subtitle">its broken rn i'll fix it later</p>
    </header>

    <nav style="text-align: center; margin: 20px 0; padding: 10px; background-color: #ffe6f7; border: 2px solid #d76fb0; border-radius: 8px;">
      <a href="index.html">home</a> |
      <a href="art.html">stuff i like</a> |
      <a href="photography.html">my photography</a> |
      <a href="diary.html">my diary</a> |
      <a href="guestbook.html">guestbook</a>
    </nav>

    <div class="notebook-pages">
      <h2>wip hehe</h2>
      
      <div class="diary-entries">
        <div class="diary-entry">
          <p class="diary-date"><strong>08/25/26</strong></p>
          <p>
            working on it lol
          </p>
        </div>
      </div>

      <button class="page-button prev-page-button" onclick="history.back()">←</button>
      <button class="page-button next-page-button" onclick="history.forward()">→</button>
    </div>
  </div>
  <script src="oneko.js"></script>
</body>
</html>
